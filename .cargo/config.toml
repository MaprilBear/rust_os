[build]
target = "thumbv7em-none-eabihf"

[target.thumbv7em-none-eabihf]
# `cargo run` inside the container boots the kernel in Renode (nRF52840).
# The linker script (-T link.ld) and map file are passed by app/build.rs.
runner = "sh renode/run.sh"

[alias]
# Build/test automation (xtask/). Run it from the repository root. It runs on
# the host, so it overrides the firmware target above; `host-tuple` means
# "whatever machine this is".
xtask = "run --quiet --manifest-path xtask/Cargo.toml --target host-tuple --"
