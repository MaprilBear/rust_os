[package]
name = "drivers"
version = "0.1.0"
edition = "2021"

# Peripheral drivers (MMIO register blocks, UARTE, TIMER, PPI) and the data
# structures they use. Linked into user flash like any non-kernel crate.
# Init code (called from `user_main`) and ISRs run privileged and may call the
# kernel directly: the IRQ API (`irq_set_priority`, `irq_enable`,
# `irq_unpend`) and `give_from_isr`. Thread-facing methods reach the kernel
# only through `userlib` syscalls.
#
# Builds for a host too: host tests point `Mmio` at fake register blocks in RAM
# and drive the kernel through `kernel::test_support`.

[dependencies]
kernel = { path = "../kernel", default-features = false }
userlib = { path = "../userlib" }
bitfields = "3.2.1"
saturating_cast = "0.1.0"

[dev-dependencies]
kernel = { path = "../kernel", features = ["test-support"] }

# Model checking of the lock-free FIFO: `cargo xtask test-loom` builds with
# `--cfg loom`, which swaps in loom's atomics and cell (src/fifo.rs).
[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }
