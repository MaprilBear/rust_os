[workspace]
resolver = "2"
members = ["kernel", "userlib", "drivers", "app"]
# Host-only build tooling (`cargo xtask ...`, see .cargo/config.toml). Kept out
# of the workspace so firmware builds (thumbv7em) never try to compile it.
exclude = ["xtask"]
default-members = ["app"]

# Profiles only take effect at the workspace root.
#
# LTO must stay off: link.ld places the kernel crate by its rlib name
# (*libkernel-*.rlib:*). Fat/thin LTO merges every crate into one object, nothing
# matches, and the whole kernel silently lands in user memory.
# `cargo xtask build` (placement check, xtask/src/placement.rs) catches that.
[profile.dev]
opt-level = 0
debug = 2
lto = "off"
codegen-units = 256
incremental = true
overflow-checks = true
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = "off"
codegen-units = 1
debug = true
