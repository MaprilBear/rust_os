[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kernel"
path = "src/os.rs"

[features]
# Quick-and-dirty console for Renode (src/debugcon.rs). On by default; build for
# real hardware with `cargo build --no-default-features`.
default = ["debugcon"]
debugcon = []

[dependencies]
bitfields = "3.2.1"
cortex-m = { version = "0.7.10", features = ["critical-section-single-core"] }
critical-section = "1.2.0"
embedded-alloc = "0.7.0"
saturating_cast = "0.1.0"

[profile.dev]
panic = "abort"
opt-level = 1      # opt-level 0 gets large; 1 keeps debugging reasonable
debug = true

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
debug = true
