[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kernel"
path = "src/os.rs"

[features]
# Quick-and-dirty console for Renode (src/debugcon.rs). On by default; build for
# real hardware with `cargo build --no-default-features`.
default = ["debugcon"]
debugcon = []

[dependencies]
bitfields = "3.2.1"
cortex-m = { version = "0.7.10", features = ["critical-section-single-core"] }
critical-section = "1.2.0"
embedded-alloc = "0.7.0"
saturating_cast = "0.1.0"

[profile.dev]
opt-level = 0
debug = 2
lto = false
codegen-units = 256
incremental = true
overflow-checks = true
panic = "abort"      # only if you already use it

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
debug = true
