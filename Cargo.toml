[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

[features]
# Quick-and-dirty console for Renode (src/debugcon.rs). On by default; build for
# real hardware with `cargo build --no-default-features`.
default = ["debugcon"]
debugcon = []

[dependencies]

[profile.dev]
panic = "abort"
opt-level = 1      # opt-level 0 gets large; 1 keeps debugging reasonable
debug = true

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
debug = true