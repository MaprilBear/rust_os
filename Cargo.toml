[workspace]
resolver = "2"
members = ["kernel", "userlib", "drivers", "app"]
# Host-only build tooling (`cargo xtask ...`, see .cargo/config.toml) and the
# cargo-fuzz targets (nightly). Kept out of the workspace so firmware builds
# (thumbv7em) never try to compile them.
exclude = ["xtask", "fuzz"]
default-members = ["app"]

# Profiles only take effect at the workspace root.
#
# LTO must stay off: link.ld places the kernel crate by its rlib name
# (*libkernel-*.rlib:*). Fat/thin LTO merges every crate into one object, nothing
# matches, and the whole kernel silently lands in user memory.
# `cargo xtask build` (placement check, xtask/src/placement.rs) catches that.
[profile.dev]
opt-level = 0
debug = 2
lto = "off"
codegen-units = 256
incremental = true
overflow-checks = true
panic = "abort"

# Keep the kernel's generic instances to itself. At low optimisation levels
# rustc shares generic instances with downstream crates (share-generics), so a
# user crate would call e.g. the kernel's copy of `core::str::Bytes::into_iter`,
# which link.ld puts in KFLASH: a MemManage fault from any thread. rustc shares
# at opt-levels 0, 1, "s" and "z", and not at 2 and 3, so the kernel builds at
# 2 in both profiles. The placement check (`cargo xtask build`,
# xtask/src/placement.rs) catches a regression.
[profile.dev.package.kernel]
opt-level = 2

[profile.release.package.kernel]
opt-level = 2

[profile.release]
panic = "abort"
opt-level = "s"
lto = "off"
codegen-units = 1
debug = true
