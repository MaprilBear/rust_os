[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

# Everything in this crate is linked into the privileged-only KFLASH/KRAM
# regions (see link.ld). Code that threads call must live in `userlib` or `app`.

[features]
# Quick-and-dirty console for Renode (src/debugcon.rs). Enabled from `app`.
debugcon = []

[dependencies]
userlib = { path = "../userlib" }
bitfields = "3.2.1"
cortex-m = { version = "0.7.10", features = ["critical-section-single-core"] }
critical-section = "1.2.0"
embedded-alloc = "0.7.0"
